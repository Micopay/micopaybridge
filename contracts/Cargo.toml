[workspace]
# Recortado del workspace de micopay-protocol (§M0.3 del plan de split).
# Faltan por migrar en M1: micopay-escrow (el del servicio x402, NO el del
# móvil — ver §1.2), micopay-badges y zk-verifier.
members = [
    "htlc-core",
    "atomic-swap",
]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
