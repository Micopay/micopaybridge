name: CI

# Los tres gates del plan (PLAN_SPLIT_Y_PUENTE_XRPL_2026-08.md §M0.4):
#   tsc --noEmit · npm test · cargo test
# Los tres son BLOQUEANTES. Este repo existe en parte porque el anterior se
# rompió por no tener gate de build; no repetirlo.
#
# Gate M0 pide además que "el repo vacío pasa CI". Por eso cada job comprueba
# primero si su manifiesto existe: mientras no exista, se salta con un aviso;
# en cuanto M0/M1 lo traigan, el gate empieza a bloquear solo. No hay que
# volver a tocar este archivo para "activarlo".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Gate 1 — tsc --noEmit ────────────────────────────────────────────────
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: probe
        name: ¿Hay workspace de Node?
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Todavía no hay package.json — gate inactivo hasta M0/M1."
          fi

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.found == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: steps.probe.outputs.found == 'true'
        run: npm ci

      # Se recorre cada workspace con tsconfig.json en vez de confiar en que
      # exista un script "typecheck": el gate no debe depender de que alguien
      # se acuerde de declararlo en cada paquete nuevo.
      - name: Typecheck de cada workspace
        if: steps.probe.outputs.found == 'true'
        run: |
          set -euo pipefail
          mapfile -t projects < <(find . -name tsconfig.json \
            -not -path '*/node_modules/*' -not -path './.git/*' | sort)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "::warning::No se encontró ningún tsconfig.json."
            exit 0
          fi

          failed=0
          for tsconfig in "${projects[@]}"; do
            echo "── $tsconfig"
            npx --no-install tsc --noEmit -p "$tsconfig" || failed=1
          done
          exit $failed

  # ── Gate 2 — npm test ───────────────────────────────────────────────────
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: probe
        name: ¿Hay script de test?
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.test?0:1)"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Todavía no hay script \"test\" — gate inactivo hasta M0/M1."
          fi

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.found == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install
        if: steps.probe.outputs.found == 'true'
        run: npm ci

      - name: Tests
        if: steps.probe.outputs.found == 'true'
        run: npm test

  # ── Gate 3 — cargo test ─────────────────────────────────────────────────
  contracts:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: probe
        name: ¿Hay workspace de Rust?
        run: |
          if [ -f contracts/Cargo.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Todavía no hay contracts/Cargo.toml — gate inactivo hasta M1."
          fi

      # Sin `toolchain:` a propósito: rustup respeta contracts/rust-toolchain.toml,
      # que ya fija canal, componentes y el target wasm32-unknown-unknown. Fijar
      # la versión aquí crearía una segunda fuente de verdad que se desincroniza.
      - name: Cache de cargo
        if: steps.probe.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: cargo-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Tests
        if: steps.probe.outputs.found == 'true'
        run: cargo test --manifest-path contracts/Cargo.toml --locked

  # Único check que conviene exigir en la protección de rama: resume a los tres
  # y falla si cualquiera falló o fue cancelado. Sin esto habría que ir
  # actualizando la lista de checks requeridos cada vez que cambie un job.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [typecheck, test, contracts]
    if: always()
    steps:
      - name: Resultado
        run: |
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test:      ${{ needs.test.result }}"
          echo "contracts: ${{ needs.contracts.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Algún gate falló."
            exit 1
          fi
